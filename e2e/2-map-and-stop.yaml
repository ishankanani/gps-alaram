# The map around Odeonsplatz (browse sheet with nearby stops), Europe zoomed out with the coverage
# dots (every stop StopWake knows), search, and the stop sheet for München Hbf, up to a running trip.
appId: com.ishankanani.gpsalarm
---
- extendedWaitUntil:
    visible:
      id: map-home
    timeout: 30000
- tapOn:
    id: map-locate
    optional: true
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: en-01-map

# stopwake://map/{lat},{lon},{zoom}: Western and Central Europe at zoom 3.55 (the second coverage
# level), then back to where the phone is.
- openLink: stopwake://map/51.0,8.5,3.55
- extendedWaitUntil:
    visible:
      id: map-home
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: en-01-overview
- tapOn:
    id: map-locate
    optional: true
- waitForAnimationToEnd:
    timeout: 10000

- tapOn:
    id: sheet-search
# Search keeps the last query: clear the field before typing.
- eraseText: 40
- inputText: "Muenchen Hbf"
- extendedWaitUntil:
    visible:
      id: search-stop-0
    timeout: 20000
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: en-02-search

- tapOn:
    id: search-stop-0
- extendedWaitUntil:
    visible:
      id: stop-start
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: en-03-stop

- tapOn:
    id: stop-start
# If a permission is still missing, the checklist comes first and starts the trip itself.
- runFlow:
    when:
      visible:
        id: screen-Setup
    commands:
      - tapOn:
          id: setup-continue
- extendedWaitUntil:
    visible:
      id: trip-screen
    timeout: 30000

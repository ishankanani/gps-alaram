# After the alarm: Arrived, then the tabs (Saved, Activity with the trip's details, Account),
# Settings and Countries (offline stop packs). Ends in Settings for e2e/6-german.yaml.
appId: com.ishankanani.gpsalarm
---
- extendedWaitUntil:
    visible:
      id: arrived-screen
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: en-06-arrived
# Keep the stop as a favourite so Saved has something to show.
- tapOn:
    id: arrived-save
    optional: true
- scrollUntilVisible:
    element:
      id: arrived-done
    direction: DOWN
- tapOn:
    id: arrived-done
# Leaving Arrived may show a (test) interstitial ad; close it with back.
- runFlow:
    when:
      notVisible:
        id: map-home
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: map-home
    timeout: 20000
# The map returns to the stop sheet, which hides the tab bar: close it (and any search) first.
- runFlow:
    when:
      visible:
        id: stop-close
    commands:
      - tapOn:
          id: stop-close
- runFlow:
    when:
      notVisible:
        id: tab-SavedTab
    commands:
      - back
- extendedWaitUntil:
    visible:
      id: tab-SavedTab
    timeout: 10000

- tapOn:
    id: tab-SavedTab
- extendedWaitUntil:
    visible:
      id: screen-SavedTab
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: en-07-saved

- tapOn:
    id: tab-ActivityTab
- extendedWaitUntil:
    visible:
      id: screen-ActivityTab
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: en-08-activity

# The trip that just rang (the newest is first).
- tapOn:
    id: "activity-trip-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: screen-TripDetail
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: en-11-trip-detail
- back
- extendedWaitUntil:
    visible:
      id: tab-AccountTab
    timeout: 10000

- tapOn:
    id: tab-AccountTab
- extendedWaitUntil:
    visible:
      id: screen-AccountTab
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: en-09-account

- tapOn:
    id: account-settings
- extendedWaitUntil:
    visible:
      id: screen-Settings
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: en-10-settings

# Countries: Germany built in, the other 16 to download (the list loads from the stop-packs release).
- scrollUntilVisible:
    element:
      id: settings-countries
    direction: DOWN
- tapOn:
    id: settings-countries
- extendedWaitUntil:
    visible:
      id: screen-Countries
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: country-at
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: en-12-countries
- back
- extendedWaitUntil:
    visible:
      id: screen-Settings
    timeout: 10000

# First start and setup, up to the map, where it asks for the current position.
# Run by e2e/screenshots.sh, which puts the phone at Odeonsplatz in Munich first.
appId: com.ishankanani.gpsalarm
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Never miss your stop"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: 01-welcome

- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 02-how-it-works

- tapOn: "Let.s set it up"
- extendedWaitUntil:
    visible: "Before you go"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 03-setup

- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Where are you going\\?"
    timeout: 20000
- tapOn: "Use my current location"

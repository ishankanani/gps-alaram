# First start, setup, the map, search and a stop, up to a running trip to München Hbf.
# Run by e2e/screenshots.sh, which puts the phone at Odeonsplatz in Munich first.
appId: com.ishankanani.gpsalarm
---
- launchApp:
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Never miss your stop"
    timeout: 120000
- waitForAnimationToEnd
- takeScreenshot: 01-welcome

- tapOn: "Continue"
- extendedWaitUntil:
    visible: "How it works"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 02-how-it-works

- tapOn: "Let.s set it up"
- extendedWaitUntil:
    visible: "Before you go"
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 03-setup

- scrollUntilVisible:
    element:
      text: "Continue"
    direction: DOWN
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Where are you going\\?"
    timeout: 20000
- tapOn: "Use my current location"
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: 04-map

- tapOn: "Where are you going\\?"
- inputText: "Muenchen Hbf"
- extendedWaitUntil:
    visible: "München Hbf"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 05-search

- tapOn: "München Hbf"
- extendedWaitUntil:
    visible: "Start alarm"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 20000
- takeScreenshot: 06-stop

# 100 or 200 m before a train station is only seconds of warning: the sheet says so.
- tapOn: "Distance"
- tapOn: "200 m"
- extendedWaitUntil:
    visible: "Use 2 min instead"
    timeout: 5000
- takeScreenshot: 07-train-warning
- tapOn: "Use 2 min instead"

- tapOn: "Start alarm"
- extendedWaitUntil:
    visible: "On the way to"
    timeout: 30000

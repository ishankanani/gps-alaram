name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the offline stops database
        # assets/stations/germany-stops.db is generated from the db-hafas-stations package (not in git).
        run: npm run build:stations
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run typecheck:server
      - run: npm run test:server

  server-image:
    name: Server Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f server/Dockerfile --build-arg GIT_COMMIT=${GITHUB_SHA::7} -t stopwake-cloud:ci .
      - name: Smoke test
        run: |
          docker run -d --name cloud -p 8787:8787 -e NODE_ENV=production -e PUBLIC_URL=http://localhost:8787 -e ALLOW_HTTP=true stopwake-cloud:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/v1/health && exit 0; sleep 1; done
          docker logs cloud; exit 1

  engine:
    name: Trip engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run engine tests (incl. 1000 simulated trips)
        working-directory: modules/trip-alarm/engine-tests
        run: ./gradlew test --no-daemon

  apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: [checks, engine]
    timeout-minutes: 60
    env:
      # The StopWake Cloud address (repository variable). Empty means a build without accounts.
      EXPO_PUBLIC_API_URL: ${{ vars.STOPWAKE_API_URL }}
      # Accounts and admin run on Supabase (supabase/README.md). Both empty: a build without accounts.
      # Only the anon (publishable) key goes into the app, never the service_role key.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - name: Build the offline stops database
        # assets/stations/germany-stops.db is generated from the db-hafas-stations package (not in git).
        run: npm run build:stations
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install
      - name: Fetch the SDK parts the build needs
        working-directory: android
        # Configuring the project installs missing SDK components (NDK, build tools); that
        # download occasionally fails on the runner, so retry it before the real build.
        run: |
          for attempt in 1 2 3; do
            ./gradlew help --no-daemon -q && exit 0
            echo "SDK setup attempt $attempt failed, retrying"
            sleep 20
          done
          exit 1
      - name: Build release APK
        working-directory: android
        # Signed with the template's debug key: fine for testers, not for the Play Store.
        # With the REVENUECAT_ANDROID_KEY secret set, Pro is sold through Google Play; without it,
        # the build has every Pro feature unlocked for testing.
        env:
          EXPO_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.REVENUECAT_ANDROID_KEY }}
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Name the APK after the commit
        run: cp android/app/build/outputs/apk/release/app-release.apk "StopWake-${GITHUB_SHA::7}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: StopWake-apk
          path: StopWake-*.apk
          retention-days: 30

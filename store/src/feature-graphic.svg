<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Google Play feature graphic: every stop StopWake knows across Europe (the app's coverage
       dots, filled in by store/tools/render-assets.mjs), your stop ringing in Munich, and the
       name. Text stays left of the centre; no alpha in the export. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5459EA"/>
      <stop offset="1" stop-color="#2B2FA3"/>
    </linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D42CF" stop-opacity="0.96"/>
      <stop offset="0.42" stop-color="#3D42CF" stop-opacity="0.82"/>
      <stop offset="0.62" stop-color="#3D42CF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  @COVERAGE@
  <rect width="1024" height="500" fill="url(#veil)"/>
  <!-- Your stop: the amber pin ringing over Munich. -->
  <g transform="translate(@PIN_X@ @PIN_Y@)">
    <circle r="40" fill="none" stroke="#FFB020" stroke-width="4" opacity="0.5"/>
    <circle r="66" fill="none" stroke="#FFB020" stroke-width="3" opacity="0.25"/>
    <g transform="translate(-35.84 -62.44) scale(0.07)">
      <path d="M512 892 C 438 780 262 640 262 452 A250 250 0 1 1 762 452 C 762 640 586 780 512 892 Z" fill="#FFB020" stroke="#2B2FA3" stroke-width="40"/>
      <circle cx="512" cy="452" r="104" fill="#FFFFFF"/>
      <circle cx="512" cy="452" r="48" fill="#2B2FA3"/>
    </g>
  </g>
  <g transform="translate(64 64) scale(0.135)">
    <rect width="1024" height="1024" rx="230" fill="url(#bg)" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="12"/>
    <g transform="translate(512 512) scale(0.84) translate(-512 -512)">@GLYPH@</g>
  </g>
  <text x="222" y="140" font-family="Inter" font-weight="700" font-size="64" fill="#FFFFFF" letter-spacing="-1.2">StopWake</text>
  <text x="66" y="270" font-family="Inter" font-weight="700" font-size="46" fill="#FFFFFF" letter-spacing="-0.8">@TAGLINE@</text>
  <text x="68" y="326" font-family="Inter" font-weight="600" font-size="27" fill="#FFC56B">@LINE1@</text>
  <text x="68" y="368" font-family="Inter" font-weight="500" font-size="23" fill="#E9EAFE">@LINE2@</text>
</svg>

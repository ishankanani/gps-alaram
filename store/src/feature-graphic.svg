<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <!-- Google Play feature graphic. Text stays inside the centre; no alpha in the export. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5459EA"/>
      <stop offset="1" stop-color="#2B2FA3"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="500" fill="url(#bg)"/>
  <!-- A transit line with stops, the last one ringing. -->
  <g opacity="0.22" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round">
    <path d="M -20 420 C 180 420 220 330 400 330 S 700 400 1044 300"/>
  </g>
  <g fill="#FFFFFF" opacity="0.35">
    <circle cx="120" cy="414" r="12"/><circle cx="400" cy="330" r="12"/><circle cx="640" cy="372" r="12"/>
  </g>
  <circle cx="880" cy="336" r="16" fill="#FFB020"/>
  <circle cx="880" cy="336" r="34" fill="none" stroke="#FFB020" stroke-width="6" opacity="0.6"/>
  <circle cx="880" cy="336" r="56" fill="none" stroke="#FFB020" stroke-width="5" opacity="0.3"/>
  <g transform="translate(92 70) scale(0.30)">
    <rect width="1024" height="1024" rx="230" fill="#3539C2"/>
    <g transform="translate(512 512) scale(0.84) translate(-512 -512)">@GLYPH@</g>
  </g>
  <text x="440" y="190" font-family="Inter" font-weight="700" font-size="84" fill="#FFFFFF" letter-spacing="-1.5">StopWake</text>
  <text x="442" y="252" font-family="Inter" font-weight="600" font-size="36" fill="#FFC56B">Never miss your stop.</text>
  <text x="442" y="300" font-family="Inter" font-weight="500" font-size="25" fill="#E9EAFE">GPS alarm for bus, train, tram and metro</text>
</svg>
